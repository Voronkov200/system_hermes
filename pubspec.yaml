name: system_hermes
description: "System Hermes — персональная Android ОС: AI, работа, учёба, финансы и локальные данные"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

# Версии пакетов зафиксированы на известных стабильных API.
dependencies:
  flutter:
    sdk: flutter

  # Иконки iOS-стиля: некоторые Flutter-компоненты ссылаются на этот шрифт.
  cupertino_icons: ^1.0.8
  # Состояние приложения
  flutter_riverpod: ^2.6.1
  # Навигация
  go_router: ^14.2.0
  # Локальная БД (hive_ce — активный форк Hive, тот же API)
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  # Файловая система и Obsidian
  path_provider: ^2.1.4
  file_picker: ^11.0.3
  watcher: ^1.1.0
  # Сеть (API Нацбанка РБ, GitHub, Hermes Agent)
  http: ^1.2.2
  # Markdown для заметок Obsidian
  flutter_markdown: ^0.7.4
  # Локальные настройки и небольшие состояния
  shared_preferences: ^2.3.2
  # PDF учебников / рендер страниц
  pdfrx: ^1.0.94
  # Для запуска URL/системных действий
  url_launcher: ^6.3.0
  # Разное
  intl: ^0.19.0
  uuid: ^4.5.1
  collection: ^1.18.0

  # Необязательная верификация активности
  flutter_health_connect: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/study/
    - assets/fonts/

  fonts:
    - family: NotoSansMath
      fonts:
        - asset: assets/fonts/NotoSansMath-Regular.ttf
