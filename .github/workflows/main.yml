name: Flutter Android Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_type:
        description: APK variant to build
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release
      install_on_phone:
        description: Install the built APK on the Android phone connected to the self-hosted runner
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  FLUTTER_CHANNEL: stable

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        # Android-платформа создаётся ниже через `flutter create`, поэтому на
        # этом шаге Gradle-файлов ещё нет. `cache: gradle` завершал workflow
        # ошибкой до запуска Flutter Analyze и тестов.
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          dart --version

      - name: Create Android platform
        run: flutter create --platforms android --org com.hermes --project-name system_hermes .

      - name: Get dependencies
        run: flutter pub get

      - name: Patch Android config
        run: bash tool/patch_android.sh

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK
        env:
          BUILD_TYPE: ${{ inputs.build_type || 'release' }}
        run: |
          if [ "$BUILD_TYPE" = "debug" ]; then
            flutter build apk --debug
            echo "APK_PATH=build/app/outputs/flutter-apk/app-debug.apk" >> "$GITHUB_ENV"
          else
            flutter build apk --release
            echo "APK_PATH=build/app/outputs/flutter-apk/app-release.apk" >> "$GITHUB_ENV"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: system-hermes-${{ inputs.build_type || 'release' }}-apk-${{ github.sha }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14

  publish_study_preview:
    name: Publish study preview
    needs: build
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'codex/study-content-gdz-fixes' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: system-hermes-release-apk-${{ github.sha }}
          path: ./apk

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v1.0.0-study-preview.1
          TARGET_SHA: a4e6e80d319ebd5940596a1bb84e73348e365212
        run: |
          set -euo pipefail
          apk=$(find ./apk -type f -name '*.apk' -print -quit)
          test -n "$apk"
          asset=./System-Hermes-study-preview.apk
          cp "$apk" "$asset"
          notes='Тестовая сборка модуля «Учёба»: проверка источника, безопасный разбор параграфов и восстановленная загрузка ГДЗ. Flutter analyze, тесты и release-сборка пройдены.'
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$asset" --clobber
          else
            gh release create "$RELEASE_TAG" "$asset" \
              --target "$TARGET_SHA" \
              --title 'System Hermes — Study Preview 1' \
              --notes "$notes" \
              --prerelease
          fi

  install_on_phone:
    name: Install APK on Android phone
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.install_on_phone == true }}
    runs-on: [self-hosted, android, usb]
    timeout-minutes: 15
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: system-hermes-${{ inputs.build_type }}-apk-${{ github.sha }}
          path: ./apk
          run-id: ${{ github.run_id }}

      - name: Check ADB
        shell: bash
        run: |
          set -euo pipefail
          command -v adb
          adb start-server
          adb devices
          count=$(adb devices | awk 'NR>1 && $2=="device" {count++} END {print count+0}')
          if [ "$count" -ne 1 ]; then
            echo "Expected exactly one authorized Android device, found $count."
            exit 1
          fi

      - name: Install APK
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find ./apk -type f -name '*.apk' -print -quit)
          test -n "$apk"
          adb install -r "$apk"
          echo "Installed: $apk"
