name: Flutter Build APK

# Сборка APK в облаке при каждом пуше в main/master или вручную.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Java 17 (обязателен для текущих версий AGP)
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Flutter SDK (последняя стабильная версия)
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Генерация платформы Android (android/ папка не хранится в репозитории,
      # чтобы не тащить бинарные файлы gradle-wrapper.jar)
      - name: Create Android platform
        run: flutter create --platforms android --org com.hermes --project-name system_hermes .

      - name: Get dependencies
        run: flutter pub get

      # Патчим AndroidManifest.xml (разрешения) и build.gradle (minSdk)
      - name: Patch Android config
        run: bash tool/patch_android.sh

      # Стабильная подпись: release-сборки подписываются debug-ключом,
      # хранящимся в репозитории (иначе каждый раннер генерирует свой ключ
      # и обновление приложения на телефоне становится невозможным)
      - name: Use stable debug keystore
        run: mkdir -p $HOME/.android && cp tool/debug.keystore $HOME/.android/debug.keystore

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
