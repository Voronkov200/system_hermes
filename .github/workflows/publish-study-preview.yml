name: Publish Study Preview

on:
  push:
    branches:
      - codex/study-content-gdz-fixes

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN_ID: '32566072578'
      SOURCE_ARTIFACT: system-hermes-release-apk-727727026f7a01db1dbc943e63532d9cea788143
      RELEASE_TAG: v1.0.0-study-preview.1
      TARGET_SHA: a4e6e80d319ebd5940596a1bb84e73348e365212
    steps:
      - name: Download verified APK
        run: |
          set -euo pipefail
          gh run download "$SOURCE_RUN_ID" \
            --name "$SOURCE_ARTIFACT" \
            --dir ./apk

      - name: Publish prerelease
        run: |
          set -euo pipefail
          apk=$(find ./apk -type f -name '*.apk' -print -quit)
          test -n "$apk"
          asset=./System-Hermes-study-preview.apk
          cp "$apk" "$asset"
          notes='Тестовая сборка модуля «Учёба»: проверка источника, безопасный разбор параграфов и восстановленная загрузка ГДЗ. Flutter analyze, тесты и release-сборка пройдены.'
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$asset" --clobber
          else
            gh release create "$RELEASE_TAG" "$asset" \
              --target "$TARGET_SHA" \
              --title 'System Hermes — Study Preview 1' \
              --notes "$notes" \
              --prerelease
          fi
